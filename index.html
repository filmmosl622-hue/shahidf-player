<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشغل الفيديو المباشر</title>
  <!-- استدعاء مكتبة HLS.js لتشغيل روابط m3u8 بسلاسة على المتصفحات وتطبيقك -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body {
      margin: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    div {
      width: 100%;
      max-width: 1000px;
    }
    video {
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <div>
    <video id="video" autoplay controls style="width:100%; height:auto;"></video>
  </div>

  <script>
    var video = document.getElementById('video');
    var videoSrc = 'https://manifest.prod.boltdns.net/manifest/v1/hls/v4/clear/6057955906001/f705f4ba-f593-4932-8771-63f5af962299/10s/master.m3u8?fastly_token=NmFlZTk2YjhfMWIyNmM3NjgxOGUxYWVlZmEwMTYxNWQwMjlkMWU5ZDRlOWY4OGMzYmEyM2VmYzEwYTQ3YzI2YzhjZGQxODExYQ%3D%3D';

    if (Hls.isSupported()) {
      var hls = new Hls();
      hls.loadSource(videoSrc);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        video.play();
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // الدعم التلقائي لمتصفحات أبل (Safari)
      video.src = videoSrc;
      video.addEventListener('loadedmetadata', function() {
        video.play();
      });
    }
  </script>
</body>
</html>
